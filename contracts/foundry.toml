[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
tempo = "${TEMPO_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
